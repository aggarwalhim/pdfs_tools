<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge PDF - Free</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px; background: #f5f7fa; color: #222; }
  h1 { font-size: 22px; }
  .box { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  button { width: 100%; padding: 12px; margin-top: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; }
  button:disabled { background: #94a3b8; }
  ul { padding-left: 18px; }
  #msg { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <h1>Merge PDF files</h1>
  <div class="box">
    <p>Select 2 or more PDFs. Your files stay on your phone and are not uploaded anywhere.</p>
    <input type="file" id="files" accept="application/pdf" multiple>
    <ul id="list"></ul>
    <button id="go" disabled>Merge and Download</button>
    <div id="msg"></div>
  </div>

<script>
  const input = document.getElementById('files');
  const list = document.getElementById('list');
  const go = document.getElementById('go');
  const msg = document.getElementById('msg');

  input.addEventListener('change', () => {
    list.innerHTML = '';
    for (const f of input.files) {
      const li = document.createElement('li');
      li.textContent = f.name;
      list.appendChild(li);
    }
    go.disabled = input.files.length < 2;
    msg.textContent = '';
  });

  go.addEventListener('click', async () => {
    try {
      go.disabled = true;
      msg.textContent = 'Merging...';
      const merged = await PDFLib.PDFDocument.create();
      for (const f of input.files) {
        const bytes = await f.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(bytes);
        const pages = await merged.copyPages(pdf, pdf.getPageIndices());
        pages.forEach(p => merged.addPage(p));
      }
      const out = await merged.save();
      const blob = new Blob([out], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'merged.pdf';
      a.click();
      msg.textContent = 'Done! Check your downloads.';
    } catch (e) {
      msg.textContent = 'Error: a file may be locked or damaged.';
    }
    go.disabled = input.files.length < 2;
  });
</script>
</body>
</html>
