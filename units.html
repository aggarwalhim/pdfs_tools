<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Converter - Length, Weight, Temperature and More</title>
<meta name="description" content="Convert length, weight, temperature, area, volume, speed, time and data size.">
<link rel="stylesheet" href="style.css">

</head>
<body class="hub">
<header>
  <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none">📏 tool4all_U</a></div>
  <p>Free, private and works on your phone</p>
</header>
<main style="padding-top:14px">
  <a class="back" href="index.html">← All tools</a>
  <div class="card" style="margin-top:6px">
    <h1>Unit Converter</h1>
    <p class="sub">Convert length, weight, temperature, area, volume, speed, time and data size.</p>

    <label class="l" for="cat">What do you want to convert?</label>
    <select class="field" id="cat" style="margin-top:0"></select>
    <div class="row2">
      <div><label class="l" for="v">Value</label><input class="field" type="number" id="v" value="1" step="any" style="margin-top:0"></div>
      <div><label class="l" for="from">From</label><select class="field" id="from" style="margin-top:0"></select></div>
    </div>
    <div class="out" id="all"></div>

    <div id="msg"></div>
  </div>
</main>
<footer>Your files stay on your device. Made with ❤ for students.</footer>
<script src="common.js"></script>
<script>

var U={
 'Length':{base:'m',u:{'millimetre (mm)':.001,'centimetre (cm)':.01,'metre (m)':1,'kilometre (km)':1000,'inch':.0254,'foot':.3048,'yard':.9144,'mile':1609.344,'nautical mile':1852}},
 'Weight / Mass':{u:{'milligram (mg)':1e-6,'gram (g)':.001,'kilogram (kg)':1,'quintal':100,'tonne':1000,'ounce (oz)':.028349523125,'pound (lb)':.45359237,'grain (gr)':6.479891e-5,'tola':.011663804}},
 'Temperature':{temp:true,u:{'Celsius (°C)':1,'Fahrenheit (°F)':1,'Kelvin (K)':1}},
 'Area':{u:{'sq centimetre':1e-4,'sq metre':1,'sq kilometre':1e6,'hectare':1e4,'acre':4046.8564224,'sq foot':.09290304,'sq yard':.83612736}},
 'Volume':{u:{'millilitre (mL)':.001,'litre (L)':1,'cubic metre':1000,'teaspoon (US)':.00492892159375,'tablespoon (US)':.01478676478125,'cup (US)':.2365882365,'fluid ounce (US)':.0295735295625,'pint (US)':.473176473,'gallon (US)':3.785411784}},
 'Speed':{u:{'metre/second':1,'km/hour':1/3.6,'mile/hour':.44704,'knot':.5144444444}},
 'Time':{u:{'millisecond':.001,'second':1,'minute':60,'hour':3600,'day':86400,'week':604800,'year (365 d)':31536000}},
 'Data size':{u:{'bit':.125,'byte':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776}}
};
var cat=$('cat');Object.keys(U).forEach(function(k){var o=document.createElement('option');o.textContent=k;cat.appendChild(o);});
function fillFrom(){var u=U[cat.value].u;$('from').innerHTML='';Object.keys(u).forEach(function(k){var o=document.createElement('option');o.textContent=k;$('from').appendChild(o);});}
function fmt(n){if(!isFinite(n))return '-';var a=Math.abs(n);if(a!==0&&(a>=1e12||a<1e-6))return n.toExponential(6);return String(parseFloat(n.toPrecision(10)));}
function toC(name,v){if(name.indexOf('Fahrenheit')>-1)return (v-32)*5/9;if(name.indexOf('Kelvin')>-1)return v-273.15;return v;}
function fromC(name,c){if(name.indexOf('Fahrenheit')>-1)return c*9/5+32;if(name.indexOf('Kelvin')>-1)return c+273.15;return c;}
function calc(){var g=U[cat.value],v=parseFloat($('v').value),from=$('from').value,h='<table class="t">';
  if(isNaN(v)){$('all').textContent='Type a number.';return;}
  Object.keys(g.u).forEach(function(k){var r;
    if(g.temp)r=fromC(k,toC(from,v));else r=v*g.u[from]/g.u[k];
    h+='<tr><td>'+k+'</td><td style="text-align:right"><b>'+fmt(r)+'</b></td></tr>';});
  $('all').innerHTML=h+'</table>';}
cat.addEventListener('change',function(){fillFrom();calc();});$('from').addEventListener('change',calc);$('v').addEventListener('input',calc);
fillFrom();calc();

</script>
</body>
</html>
