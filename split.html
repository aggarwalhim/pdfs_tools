<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split PDF Online - Free PDF Tools</title>
<meta name="description" content="Keep only the pages you need from a PDF. Free, private, no sign-up.">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<header>
  <div class="brand">📄 PDF Tools</div>
  <p>Free PDF tools for students and everyone</p>
  <div class="badges"><span>✔ 100% Free</span><span>🔒 Private</span><span>⚡ No upload</span></div>
</header>
<main>
  <nav><a href="index.html">📎 Merge</a><a href="split.html" class=on>✂️ Split</a><a href="rotate.html">🔄 Rotate</a></nav>
  <div class="card">
    <h1>Split PDF</h1>
    <p class="sub">Keep only the pages you need from a PDF. Free, private, no sign-up.</p>
    <label class="drop"><div class="ico">📂</div><b>Tap to choose a PDF</b><small>One PDF file</small>
      <input type="file" id="file" accept="application/pdf"></label>
    <p class="sub" id="info" style="margin-top:12px"></p>
    <input class="field" type="text" id="range" placeholder="Pages to keep, e.g. 1-3,5,8-10">
    <button class="go" id="go" disabled>Extract and Download</button>
    <div id="msg"></div>
  </div>
  <div class="card">
    <div class="steps">
      <div><b>1</b>Choose file</div><div><b>2</b>Tap the button</div><div><b>3</b>Download</div>
    </div>
  </div>
</main>
<footer>Your files never leave your device. Made with ❤ for students.</footer>
<script>

function setMsg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className=c||'';}
function save(bytes,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;a.click();}

const file=document.getElementById('file'),info=document.getElementById('info'),range=document.getElementById('range'),go=document.getElementById('go');let total=0;
file.addEventListener('change',async()=>{setMsg('');go.disabled=true;if(!file.files[0])return;
try{const pdf=await PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());total=pdf.getPageCount();info.textContent='📄 '+file.files[0].name+' has '+total+' pages.';go.disabled=false;}
catch(e){info.textContent='';setMsg('Error: file may be locked or damaged.','err');}});
function parseRange(text,max){const pages=[];for(const part of text.split(',')){const p=part.trim();if(!p)continue;const m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;const a=parseInt(m[1],10),b=m[2]?parseInt(m[2],10):a;if(a<1||b<a||b>max)return null;for(let i=a;i<=b;i++)pages.push(i-1);}return pages.length?pages:null;}
go.addEventListener('click',async()=>{const pages=parseRange(range.value,total);
if(!pages){setMsg('Enter valid pages like 1-3,5 (max '+total+').','err');return;}
try{go.disabled=true;setMsg('Working...');const src=await PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());const out=await PDFLib.PDFDocument.create();
(await out.copyPages(src,pages)).forEach(p=>out.addPage(p));save(await out.save(),'split.pdf');setMsg('Done! Check your downloads.','ok');}
catch(e){setMsg('Error: could not process this file.','err');}
go.disabled=false;});

</script>
</body>
</html>
