<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Watermark or Text on Photo Online - Free</title>
<meta name="description" content="Write your name or a watermark on any photo. Free, private, works on phone.">
<link rel="stylesheet" href="style.css">

</head>
<body class="hub">
<header>
  <div class="brand"><a href="index.html" style="color:#fff;text-decoration:none">🖼️ tool4all_U</a></div>
  <p>Free, private and works on your phone</p>
</header>
<main style="padding-top:14px">
  <a class="back" href="index.html">← All tools</a>
  <div class="card" style="margin-top:6px">
    <h1>Text and Watermark on Photo</h1>
    <p class="sub">Write your name or a watermark on any photo. Free, private, works on phone.</p>

    <label class="l" for="file">Choose a photo</label>
    <input class="field" type="file" id="file" accept="image/*">
    <label class="l" for="txt">Text</label>
    <input class="field" type="text" id="txt" value="My Name" maxlength="80">
    <div class="row2">
      <div><label class="l" for="size">Size (%)</label><input class="field" type="number" id="size" value="6" min="1" max="60"></div>
      <div><label class="l" for="op">Opacity (%)</label><input class="field" type="number" id="op" value="70" min="5" max="100"></div>
    </div>
    <div class="row2">
      <div><label class="l" for="col">Colour</label><input class="field" type="color" id="col" value="#ffffff" style="height:46px;padding:4px"></div>
      <div><label class="l" for="pos">Position</label>
        <select class="field" id="pos" style="margin-top:0">
          <option value="br">Bottom right</option><option value="bl">Bottom left</option>
          <option value="tr">Top right</option><option value="tl">Top left</option>
          <option value="c">Centre</option><option value="tile">Repeat all over</option>
        </select></div>
    </div>
    <div class="row2">
      <div><label class="l" for="rot">Tilt (degrees)</label><input class="field" type="number" id="rot" value="0" min="-90" max="90"></div>
      <div><label class="l" for="fmt">Save as</label>
        <select class="field" id="fmt" style="margin-top:0"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></div>
    </div>
    <canvas id="cv" class="pv" hidden></canvas>
    <button class="go" id="go" disabled>Download photo</button>

    <div id="msg"></div>
  </div>
</main>
<footer>Your files stay on your device. Made with ❤ for students.</footer>
<script src="common.js"></script>
<script>

var img=null,cv=$('cv'),ctx=cv.getContext('2d');
function draw(){
  if(!img)return;
  var MAX=2400,s=Math.min(1,MAX/Math.max(img.width,img.height));
  cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  ctx.drawImage(img,0,0,cv.width,cv.height);
  var t=$('txt').value;if(!t)return;
  var fs=Math.max(8,cv.width*(parseFloat($('size').value)||6)/100);
  ctx.font='bold '+fs+'px Arial,sans-serif';
  ctx.globalAlpha=Math.min(1,Math.max(.05,(parseFloat($('op').value)||70)/100));
  ctx.fillStyle=$('col').value;ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=fs/8;
  var ang=(parseFloat($('rot').value)||0)*Math.PI/180,pos=$('pos').value,m=fs*0.6,w=ctx.measureText(t).width;
  if(pos==='tile'){
    var stepx=w+fs*2,stepy=fs*3;ctx.textAlign='left';
    ctx.save();ctx.translate(cv.width/2,cv.height/2);ctx.rotate(ang||-0.5);
    var R=Math.hypot(cv.width,cv.height);
    for(var y=-R;y<R;y+=stepy){for(var x=-R;x<R;x+=stepx){ctx.fillText(t,x,y);}}
    ctx.restore();
  }else{
    var x,y,al='left';
    if(pos==='br'){x=cv.width-m;y=cv.height-m-fs/2;al='right';}
    if(pos==='bl'){x=m;y=cv.height-m-fs/2;al='left';}
    if(pos==='tr'){x=cv.width-m;y=m+fs/2;al='right';}
    if(pos==='tl'){x=m;y=m+fs/2;al='left';}
    if(pos==='c'){x=cv.width/2;y=cv.height/2;al='center';}
    ctx.textAlign=al;ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillText(t,0,0);ctx.restore();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}
$('file').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;
  readImage(f).then(function(i){img=i;cv.hidden=false;$('go').disabled=false;setMsg('');draw();}).catch(function(){setMsg('This file is not a valid image.','err');});
});
['txt','size','op','col','pos','rot'].forEach(function(id){$(id).addEventListener('input',draw);});
$('go').addEventListener('click',function(){
  var f=$('fmt').value;
  toBlob(cv,f,0.92).then(function(b){download(b,'photo-with-text.'+(f==='image/png'?'png':'jpg'));setMsg('Done! Check your downloads.','ok');});
});

</script>
</body>
</html>
